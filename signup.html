<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up | EverAfter</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-shell"><a class="brand" href="index.html">✦ EverAfter</a><div class="auth-card"><div class="auth-art"><p class="eyebrow">YOUR STORY STARTS HERE</p><h1>Let's plan something unforgettable.</h1><p>Create your account and save your wedding journey.</p></div><form id="signupForm"><h2>Create account</h2><p class="muted">It only takes a minute.</p><label>Full Name<input id="name" required placeholder="Your full name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Phone<input id="phone" pattern="[0-9]{10}" required placeholder="10 digit phone"></label><label>Password<div class="password"><input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters"><button type="button" class="eye" onclick="togglePass('password')">◉</button></div></label><label>Confirm Password<input id="confirm" type="password" required placeholder="Repeat password"></label><button class="btn full">Create Account →</button><p class="switch">Already registered? <a href="login.html">Sign in</a></p></form></div></div><div id="toast"></div><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
